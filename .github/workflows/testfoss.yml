name: Testfoss demo

on:
  push:
    branches: [testfoss-demo]
  pull_request:
    branches: [testfoss-demo]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testfoss-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the fork and pinned upstream history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the lab-proven Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0

      - name: Install pnpm and LMScript
        run: npm install --global pnpm@12.18.0 @lmctl-ai/lmctl@0.2.463

      - name: Install the pinned lmwebtest host
        run: npm ci --prefix testfoss

      - name: Install Chromium and its Linux dependencies
        run: npm exec --prefix testfoss -- playwright install --with-deps chromium

      - name: Build, run focused upstream tests, and exercise the browser demo
        run: ./testfoss/run.sh
        env:
          CI: "true"
          CARGO_BUILD_JOBS: "2"
